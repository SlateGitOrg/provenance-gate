[project]
name = "provenance-gate"
version = "0.1.0"
description = "A SLSA provenance verifier that proves a binary came from the reviewed source - by rebuilding it, not by trusting the attestation."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
